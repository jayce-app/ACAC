services:
  - type: web
    name: acac-website
    runtime: static
    repo: https://github.com/jayce-app/ACAC
    branch: cursor/acac-website-2453
    # Redeploy automatically on every push to this branch
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: RENDER
        value: "true"
      - key: VITE_BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
