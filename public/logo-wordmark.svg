<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Ropers Construction">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f3f4"/>
      <stop offset="35%" stop-color="#c8ced1"/>
      <stop offset="55%" stop-color="#e8eaed"/>
      <stop offset="100%" stop-color="#9aa1ab"/>
    </linearGradient>
    <linearGradient id="steel-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eceef1"/>
      <stop offset="45%" stop-color="#b4bac2"/>
      <stop offset="100%" stop-color="#7e868f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#12151a"/>
    </linearGradient>
  </defs>

  <!-- Left steel pillars -->
  <rect x="18" y="18" width="22" height="184" fill="url(#steel-v)"/>
  <rect x="48" y="28" width="18" height="154" fill="url(#steel-v)"/>
  <rect x="34" y="34" width="12" height="148" fill="#1a1c1e"/>

  <!-- Roof / house silhouette -->
  <path
    d="M34 78 L34 48 L118 18 L292 18 L292 42 L118 42 L70 62 L70 78 Z"
    fill="url(#ink)"
  />
  <path
    d="M70 78 L118 52 L250 52 L250 78 Z"
    fill="#2a2e34"
  />

  <!-- Horizontal steel bar -->
  <path d="M70 118 H640 L668 148 H70 Z" fill="url(#steel)"/>
  <path d="M70 148 H668 L640 168 H70 Z" fill="#8a9199" opacity="0.55"/>

  <!-- Wordmark -->
  <text
    x="118"
    y="100"
    fill="url(#ink)"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="54"
    font-weight="700"
    letter-spacing="0.04em"
  >ROPERS</text>

  <text
    x="118"
    y="144"
    fill="#0a0a0a"
    font-family="Arial Narrow, Arial, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="0.28em"
  >CONSTRUCTION</text>

  <text
    x="118"
    y="196"
    fill="#4a5058"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14"
    font-weight="600"
    letter-spacing="0.22em"
  >TURNING VISIONS INTO REALITY</text>
</svg>
