name: Deploy to Render

# After the site is connected in Render, pushes to this branch auto-deploy.
# This workflow is a backup trigger via Deploy Hook (optional secret).
on:
  push:
    branches: [cursor/acac-website-2453]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: true

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK secret set."
            echo "If the Render service is connected to GitHub with Auto-Deploy on,"
            echo "pushes to cursor/acac-website-2453 already deploy without this hook."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo
          echo "Render deploy triggered."
